<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- No remote content, no inline eval: the window only ever talks to the
         main process over IPC, so nothing needs to be fetched. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"
    />
    <title>EasyDeck</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #16181d;
        color: #e6e8ec;
      }
      main {
        text-align: center;
        max-width: 34rem;
        padding: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0.25rem 0;
        color: #9aa0aa;
        font-size: 0.95rem;
      }
      #status {
        margin-top: 1.5rem;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        background: #1e222a;
        border: 1px solid #2c3139;
        font-size: 0.95rem;
      }
      .ok { color: #4ade80; }
      .bad { color: #f87171; }
      .muted { color: #9aa0aa; }
    </style>
  </head>
  <body>
    <main>
      <h1>EasyDeck</h1>
      <p>The configurator lands here next.</p>
      <p>Closing this window keeps the deck running in the tray. Quit from there.</p>
      <div id="status" class="muted">Connecting…</div>
    </main>

    <script>
      const box = document.getElementById('status');

      function render(status) {
        if (!status) return;
        if (status.state === 'locked') {
          box.className = 'muted';
          box.textContent = 'Device released while the screen is locked';
        } else if (status.state === 'running') {
          box.className = 'ok';
          box.textContent = `Connected: ${status.device} — profile "${status.profileId ?? '—'}"`;
        } else if (status.state === 'error') {
          box.className = 'bad';
          box.textContent = `Not running: ${status.message}`;
        } else {
          box.className = 'muted';
          box.textContent = status.state === 'starting' ? 'Starting…' : 'Stopped';
        }
      }

      window.easydeck.getStatus().then(render);
      window.easydeck.onStatus(render);

      // Proves the IPC bridge carries the real protocol, not just a status
      // string: this is the same getState the WebSocket API answers.
      window.easydeck
        .request({ type: 'request', id: '1', method: 'getState' })
        .then((response) => console.log('getState over IPC:', response));
    </script>
  </body>
</html>
