name: Release

on:
  push:
    tags: ['v*']
  # A dispatch run does one of two things, depending on whether it is given a
  # tag. With one, it cuts the release: the tag is created here and everything
  # downstream is packaged and published from it — which is the whole point,
  # because GitHub's own interface has no way to make a tag. Without one, it is
  # a rehearsal: the installers appear as run artifacts, no release and no tag
  # to take back.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to cut, e.g. v0.2.0 — created on the branch chosen above. Leave empty to rehearse: packages everything, publishes nothing.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # What this run is about, decided once and answered to by every job below.
  #
  # Before, each job worked it out from the ref, which was fine while a release
  # could only start from a tag that already existed. Making the tag here means
  # there is a moment when the ref says "branch" and the run is nonetheless a
  # release, so the answer has to be computed rather than read.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      # The one job that writes: it pushes the tag.
      contents: write
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      sha: ${{ steps.plan.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: What this run is
        id: plan
        shell: bash
        env:
          WANTED: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag=''
          create=false

          # Trimmed, because a name typed into a web form arrives with whatever
          # came with it, and " v0.2.0" is not a different intention.
          wanted="$(printf '%s' "$WANTED" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"

          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # The tag arrived on its own; nothing to create.
            tag="$GITHUB_REF_NAME"
          elif [ -n "$wanted" ]; then
            tag="$wanted"
            create=true
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            # Dispatched from a tag with no name given: re-cutting a release
            # whose first attempt failed, which is worth being able to do.
            tag="$GITHUB_REF_NAME"
          fi

          if [ -n "$tag" ]; then
            # The shape the rest of the file relies on: the push trigger only
            # listens for v*, the version is this minus the v, and a suffix is
            # what marks a pre-release. A name that does not fit is caught here
            # rather than three jobs and twenty minutes later.
            if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::'$tag' is not a release tag. Expected v<major>.<minor>.<patch>, optionally with a suffix — v0.2.0, v0.2.0-beta.1."
              exit 1
            fi

            version="${tag#v}"
            publish=true
          else
            version="$(node -p "require('./packages/app/package.json').version")-dev.$GITHUB_RUN_NUMBER"
            publish=false
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "publish=$publish"
            echo "create=$create"
            # Every job packages this exact commit rather than whatever the
            # branch has come to mean since: a push landing mid-run must not
            # end up in a release the tag says is something else.
            echo "sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

          echo "Packaging $version${tag:+ as $tag} from ${GITHUB_SHA:0:7}"

      - name: Create the tag
        if: steps.plan.outputs.create == 'true'
        shell: bash
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail

          # A tag that exists already is not re-pointed. It may be what an
          # earlier release was built from, and moving it would leave that
          # release describing a commit it was never cut from — so this stops
          # and says which tag, rather than forcing anything.
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "::error::The tag $TAG already exists. Pick another name, or dispatch this workflow from that tag to cut its release again."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Annotated, so the tag carries who made it and when.
          git tag -a "$TAG" -m "EasyDeck ${TAG#v}"
          git push origin "refs/tags/$TAG"

          echo "::notice::Created $TAG at ${GITHUB_SHA:0:7}"

          # Nothing else starts because of this. A tag pushed with the run's own
          # GITHUB_TOKEN does not set workflows going — deliberately, so a
          # workflow cannot trigger itself for ever — which is exactly why this
          # run goes on to package and publish rather than handing over.

  package:
    name: ${{ matrix.os }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Each runner packages its own platform and nothing else. The native
        # zones — HID, canvas, libjpeg-turbo, sharp — install binaries picked
        # for the machine doing the installing, so a Linux runner simply has
        # no macOS libraries to put inside a .dmg.
        #
        # Two Macs because they are two architectures: macos-latest is Apple
        # silicon, macos-15-intel is x86_64.
        #
        # It used to be macos-13, which GitHub retired on 4 December 2025. A
        # retired label is not an error — nothing rejects the job, no runner
        # ever claims it, and it sits at "waiting for a runner" until the
        # six-hour timeout. Worth knowing the shape of, because the next image
        # will go the same way: Intel on macOS ends when macOS 15 retires in
        # autumn 2027, and this line is where that lands.
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]

    steps:
      - uses: actions/checkout@v4
        with:
          # The commit the tag was put on, not the branch as it stands now.
          ref: ${{ needs.plan.outputs.sha }}

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      # Said out loud so a half-finished setup is visible here rather than
      # discovered by whoever downloads the result. Booleans only: what is in
      # the secrets never reaches the log.
      - name: What this build can sign with
        if: runner.os == 'macOS'
        shell: bash
        run: |
          certificate=${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
          notarisation=${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
          echo "Developer ID certificate: $certificate"
          echo "Notarisation credentials: $notarisation"

          if [ "$certificate" = false ] || [ "$notarisation" = false ]; then
            echo "::warning::macOS will refuse this build on first run: Gatekeeper wants both a Developer ID signature and Apple's notarisation, and this build has $([ "$certificate" = true ] && echo 'only the first' || echo 'neither')."
          fi

      # The tag is the version. Nothing in the repository is edited to match
      # it — the packager is told what to stamp — so a release can never
      # disagree with the commit it was cut from.
      - name: Package
        shell: bash
        env:
          # The Developer ID, on the Macs and nowhere else.
          #
          # Empty everywhere else on purpose: Windows reads `CSC_LINK` too when
          # `WIN_CSC_LINK` is absent, and an Apple certificate is not one
          # signtool can use. Empty is turned into absent by the script below —
          # see the note there, which is what an empty one cost us.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          # With no certificate there is nothing to discover, and saying so
          # outright beats letting the packager hunt the keychain and fail late.
          # With one, the link above is explicit and discovery costs nothing.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
          # Notarisation. The packager asks Apple only when all three are here
          # and skips with a warning when they are not, so this file needs no
          # branch for "before the certificate existed" — adding the secrets is
          # the whole of turning it on.
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail

          # Empty is not the same as absent to this packager, and the two
          # platforms disagree about it. Windows checks for the empty string
          # and takes it as "no certificate"; macOS checks only for null, so an
          # empty `CSC_LINK` is read as a *path*, resolved against the project
          # directory, and the build dies on "packages/app not a file" — which
          # is exactly how the first Mac release failed. Anything still empty
          # is therefore removed rather than passed on.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name:-}" ] || unset "$name"
          done

          # Said out loud, because the packager publishes by itself when it
          # smells CI and warns that it will stop doing so in version 27. What
          # gets published here is decided by the job below, from artifacts
          # every platform contributed to — never by one runner with a quarter
          # of the installers.
          pnpm --filter @easydeck/app exec electron-builder \
            --publish never \
            --config.extraMetadata.version=${{ needs.plan.outputs.version }}

      # Patterns that match nothing on a given platform are fine; a job where
      # none of them matched is not, and that is what the error setting catches.
      #
      # The `.yml` files are the update manifests the packager wrote next to the
      # installers. They are what an installed copy reads to learn a newer one
      # exists, so they travel with the files they describe — all but
      # `builder-debug.yml`, which is a log of how the build went and has no
      # business in a release.
      #
      # A `.blockmap` is how an update becomes a download of the changed parts
      # rather than the whole installer again. Without it everything still
      # works, only slower.
      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            packages/app/release/*.exe
            packages/app/release/*.dmg
            packages/app/release/*.zip
            packages/app/release/*.AppImage
            packages/app/release/*.deb
            packages/app/release/*.blockmap
            packages/app/release/*.yml
            !packages/app/release/builder-debug.yml

  publish:
    name: Publish
    # Only a run with a tag becomes a release. This is the line that makes a
    # dispatch with no tag a rehearsal rather than an accident.
    if: needs.plan.outputs.publish == 'true'
    needs: [plan, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Kept apart, one folder per runner. Merged on arrival they would collide:
      # the two Macs write a manifest under the same name, and whichever landed
      # second would be the only one left. The step below puts them together
      # deliberately.
      - name: Collect every platform's installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # An installed copy finds out about a new one by reading a manifest named
      # after its channel. There are two channels — stable and pre-release — and
      # this is where the files every runner wrote are turned into that pair.
      - name: One manifest per channel
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail

          # The packager names a manifest after the version's prerelease
          # identifier: 0.3.0-rc.1 writes rc.yml, 0.3.0 writes latest.yml.
          channel=latest
          case "$VERSION" in
            *-*) rest="${VERSION#*-}"; channel="${rest%%.*}" ;;
          esac
          echo "Packaged as the '$channel' channel"

          mkdir -p installers

          # The installers need no thought: no two runners produced the same
          # file, because every artifact name carries its platform and arch.
          find artifacts -type f ! -name '*.yml' -exec mv -t installers/ {} +

          # macOS is the one platform packaged twice, and each runner describes
          # only the architecture it built. Merged rather than picked, or half
          # the Macs are offered a build that will not run on them.
          #
          # Intel goes first. The updater walks `files` in order and takes the
          # first zip it can use, looking for an architecture in the name only
          # when it is running on Apple silicon — so whatever is first is what
          # an Intel Mac ends up with.
          intel="artifacts/installers-macos-15-intel/$channel-mac.yml"
          arm="artifacts/installers-macos-latest/$channel-mac.yml"
          if [ -f "$intel" ] && [ -f "$arm" ]; then
            yq eval-all '. as $m ireduce ({}; . *+ $m)' "$intel" "$arm" \
              > "installers/$channel-mac.yml"
            rm "$intel" "$arm"
            echo "Merged both Macs into $channel-mac.yml"
          fi

          # Windows and Linux wrote one each, and the Macs are already dealt
          # with, so nothing left can clash.
          find artifacts -type f -name '*.yml' -exec mv -t installers/ {} +

          cd installers

          # A release with no manifest installs fine and never updates, which is
          # the kind of thing noticed months later. Said now instead.
          if ! ls ./*.yml >/dev/null 2>&1; then
            echo "::error::No update manifests were packaged. The publish provider in electron-builder.yml is what makes them; check it is still there."
            exit 1
          fi

          for platform in '' '-mac' '-linux'; do
            source="$channel$platform.yml"
            [ -f "$source" ] || continue

            if [ "$channel" = latest ]; then
              # The newest stable build is also the newest thing anyone on the
              # pre-release channel should be offered, so it goes into the
              # release under both names. Without this, a pre-release
              # subscriber sits on an old beta while stable moves past them.
              cp -- "$source" "beta$platform.yml"
            elif [ "$channel" != beta ]; then
              # rc, dev, alpha: the suffix says how ripe a build is, not who
              # gets it. There is one pre-release channel and it is called
              # beta, so the manifest is renamed to match.
              mv -- "$source" "beta$platform.yml"
            fi
          done

          echo "Publishing:"
          ls -1

      - name: Checksums
        run: |
          cd installers
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # A version carrying a suffix — 0.2.0-beta.1 — is not a finished
          # release, and GitHub should say so on the tin.
          prerelease=''
          case "$VERSION" in *-*) prerelease='--prerelease' ;; esac

          # How to install comes first, because that is what someone arriving
          # at the page is here for; the commit list GitHub generates follows.
          {
            cat <<'END'
          Built by CI from the tag, one package per platform.

          - **Windows** — the `-windows-x64-setup.exe`. Unsigned, so SmartScreen
            will object: "More info" then "Run anyway".
          - **macOS** — the `.dmg` for your machine, `arm64` for Apple silicon or
            `x64` for Intel. There is no Apple Developer ID behind this build, so
            macOS will refuse it on the first try — "Apple could not verify
            EasyDeck is free of malware", with nothing but Move to Bin and Done.
            That dialog is expected and says nothing about the file.

            Copy the app to Applications first, then either:

            - `xattr -dr com.apple.quarantine /Applications/EasyDeck.app`, or
            - open it once, let it be refused, then **System Settings → Privacy
              & Security → Open Anyway**. On macOS 15 and later this is the only
              route through the window itself; Control-clicking Open no longer
              gets past it.
          - **Linux** — the `.AppImage` or the `.deb`, x64. The deck is a USB HID
            device: without a udev rule granting your session access to it,
            EasyDeck starts and finds nothing.

          `SHA256SUMS.txt` covers every file here.

          EasyDeck is in early development. The README says plainly what works
          and what does not.

          END
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body
          } > notes.md

          # Word splitting on $prerelease is deliberate: empty means the flag
          # is absent, and quoting it would pass an empty argument instead.
          # shellcheck disable=SC2086
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "EasyDeck $VERSION" \
            --notes-file notes.md \
            $prerelease \
            installers/*
